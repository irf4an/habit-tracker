<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0e" />
      <stop offset="100%" stop-color="#14141e" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161622" />
      <stop offset="100%" stop-color="#101017" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8338ec" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="180" fill="#8338ec" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#3b82f6" opacity="0.14" filter="url(#glow)" />

  <!-- Header / Brand -->
  <g transform="translate(100, 80)">
    <!-- App Logo Icon -->
    <rect width="48" height="48" rx="14" fill="#8338ec" />
    <path d="M16 25 L22 31 L32 17" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="64" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      Minimal Habit Tracker
    </text>
    <text x="64" y="52" fill="#8338ec" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">
      52-WEEKS HEATMAP • POMODORO • GAMIFICATION
    </text>
  </g>

  <!-- Big Catchy Title -->
  <text x="100" y="210" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    Build consistency, one block at a time.
  </text>
  <text x="100" y="250" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    Track daily routines in a clean heatmap grid with audio feedback &amp; streak protection.
  </text>

  <!-- Mock Dashboard Card UI -->
  <g transform="translate(100, 290)">
    <!-- Card Base -->
    <rect width="1000" height="260" rx="24" fill="url(#cardGrad)" stroke="#8338ec" stroke-opacity="0.4" stroke-width="2" />

    <!-- Card Header: gym habit -->
    <g transform="translate(36, 32)">
      <!-- Check Button -->
      <circle cx="20" cy="20" r="20" fill="#3b82f6" />
      <path d="M13 21 L18 26 L27 15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <text x="56" y="22" font-size="26">💪</text>
      <text x="96" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">gym</text>
      
      <!-- Tag -->
      <rect x="150" y="4" width="70" height="22" rx="11" fill="#1e1e2d" stroke="#2a2a40" stroke-width="1" />
      <text x="185" y="19" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="middle">Fitness</text>

      <!-- Streak Pill -->
      <rect x="232" y="4" width="110" height="22" rx="6" fill="#3b82f6" fill-opacity="0.2" />
      <text x="287" y="19" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">🔥 14d streak</text>
      <text x="358" y="19" fill="#6b7280" font-family="monospace" font-size="12">Best: 21d  •  92% (30d)</text>
    </g>

    <!-- 52-week Heatmap Grid Representation -->
    <g transform="translate(76, 95)">
      <!-- Row Month Labels -->
      <text x="0" y="-8" fill="#6b7280" font-family="monospace" font-size="10">Sep</text>
      <text x="140" y="-8" fill="#6b7280" font-family="monospace" font-size="10">Oct</text>
      <text x="280" y="-8" fill="#6b7280" font-family="monospace" font-size="10">Nov</text>
      <text x="420" y="-8" fill="#6b7280" font-family="monospace" font-size="10">Dec</text>
      <text x="560" y="-8" fill="#6b7280" font-family="monospace" font-size="10">Jan</text>
      <text x="700" y="-8" fill="#6b7280" font-family="monospace" font-size="10">Feb</text>

      <!-- Blocks Pattern (35 weeks x 7 days) -->
